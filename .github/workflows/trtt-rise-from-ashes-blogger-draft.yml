name: RISE FROM ASHES — Blogger Draft

on:
  pull_request:
    branches: [main]
    paths:
      - blogger-drafts/rise-from-ashes.html
      - scripts/create_blogger_draft.py
      - requirements-blogger.txt
      - .github/workflows/trtt-rise-from-ashes-blogger-draft.yml
  push:
    branches: [main]
    paths:
      - blogger-drafts/rise-from-ashes.html

permissions:
  contents: read

concurrency:
  group: trtt-rise-from-ashes-blogger-draft
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed article
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Blogger HTML without credentials
        run: python scripts/create_blogger_draft.py --validate-only

  create-blogger-draft:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged article
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Blogger API client
        run: python -m pip install --disable-pip-version-check -r requirements-blogger.txt
      - name: Create or verify Blogger DRAFT only
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python scripts/create_blogger_draft.py
